[project]
name = "phone-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "twilio>=9.12.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Supply-chain cooldown: only resolve releases at least 7 days old.
exclude-newer = "7 days"
# Cooldown exception (factory 2026-10-22): certifi 2026.10.19 removes the
# distrusted "emSign ECC Root CA - G3" (Semgrep ssc-5df0a6b6-da47-4290-9f7c-28111c57478b).
# Remove this exemption on the next factory run.
exclude-newer-package = { certifi = false }
constraint-dependencies = ["certifi>=2026.10.19"]
